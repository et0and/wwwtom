# Use the latest 2.1 version of CircleCI pipeline process engine.
version: 2.1

# Define orbs for third-party integrations
orbs:
  node: circleci/node@5.1.0

# Define jobs
jobs:
  ci:
    docker:
      - image: cimg/node:24.7.0

    steps:
      - checkout

      # Install Bun
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV

      # Cache dependencies
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lockb" }}
            - bun-deps-v1-

      - run:
          name: Install dependencies
          command: bun install

      - save_cache:
          key: bun-deps-v1-{{ checksum "bun.lockb" }}
          paths:
            - ~/.bun/install/cache
            - node_modules

      - run:
          name: Lint
          command: bun run lint

      - run:
          name: Build
          command: bun run build

      - run:
          name: Check formatting
          command: bun run format

  release:
    docker:
      - image: cimg/node:24.7.0

    steps:
      - checkout

      # Install Bun
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV

      # Cache dependencies
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lockb" }}
            - bun-deps-v1-

      - run:
          name: Install dependencies
          command: bun install

      - save_cache:
          key: bun-deps-v1-{{ checksum "bun.lockb" }}
          paths:
            - ~/.bun/install/cache
            - node_modules

      - run:
          name: Lint
          command: bun run lint

      - run:
          name: Build
          command: bun run build

      - run:
          name: Release
          command: bunx semantic-release
          environment:
            GITHUB_TOKEN: $CIRCLE_TOKEN

# Define workflows
workflows:
  version: 2

  # CI workflow - runs on all branches and pull requests
  ci_workflow:
    jobs:
      - ci:
          filters:
            branches:
              ignore: main

  # Main workflow - runs CI + Release on main branch
  main_workflow:
    jobs:
      - ci:
          filters:
            branches:
              only: main
      - release:
          requires:
            - ci
          filters:
            branches:
              only: main
