name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # The trigger/author check moved into .github/actions/oc-gate (shared
    # with the PR-comments workflow): the job runs on every comment and
    # gates its real steps on the composite's `triggered` output.
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Local composite actions (oc-gate) require the workspace first.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OpenCode gate
        id: oc
        uses: ./.github/actions/oc-gate
        with:
          allowed-users: et0and

      - name: Run opencode
        if: steps.oc.outputs.triggered == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: deepseek/deepseek-v4-flash-0731
