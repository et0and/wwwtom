name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    name: Deploy PR preview
    runs-on: ubuntu-latest
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      ALCHEMY_ENV_FILE: /dev/null
      # Alchemy's GitHub provider (preview-comment resource in the web stack)
      # needs a token to post/update the preview comment.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Deploys shared -> api -> adapter -> web. The web stack posts or
      # updates the preview comment via infra/utils/github/preview-comment.ts.
      - name: Deploy preview stage
        run: >
          pnpm deploy:shared --yes &&
          pnpm deploy:api --yes &&
          pnpm deploy:adapter --yes &&
          pnpm deploy:web --yes

  destroy:
    if: github.event.action == 'closed'
    name: Destroy PR preview
    runs-on: ubuntu-latest
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      ALCHEMY_ENV_FILE: /dev/null
      # Parity with the deploy job: the web stack declares a GitHub
      # preview-comment resource, so its provider needs a token even on
      # teardown. PULL_REQUEST keeps the code path identical to deploy.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # Teardown needs the infra code and secrets, not the PR head (which
      # may already be deleted on close), so check out the base branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: ./.github/actions/setup

      # Tears down web -> adapter -> api -> shared so no preview resources
      # linger after the PR is merged or closed. Separate steps with
      # `if: always()` so one stack's failure never blocks the rest —
      # a single `&&` chain orphans workers (e.g. api/adapter) when an
      # earlier destroy fails.
      - name: Destroy web preview stage
        run: pnpm destroy:web --yes

      - name: Destroy adapter preview stage
        if: always()
        run: pnpm destroy:adapter --yes

      - name: Destroy api preview stage
        if: always()
        run: pnpm destroy:api --yes

      - name: Destroy shared preview stage
        if: always()
        run: pnpm destroy:shared --yes
