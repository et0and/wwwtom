name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    name: Deploy PR preview
    runs-on: ubuntu-latest
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      ALCHEMY_ENV_FILE: /dev/null
      # Alchemy's GitHub provider (preview-comment resource in the web stack)
      # needs a token to post/update the preview comment.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # Shared setup (checkout, pnpm, store cache, frozen install).
      - uses: ./.github/actions/setup

      # Deploys shared -> api -> adapter -> web. The web stack posts or
      # updates the preview comment via infra/utils/github/preview-comment.ts.
      - name: Deploy preview stage
        run: >
          pnpm deploy:shared --yes &&
          pnpm deploy:api --yes &&
          pnpm deploy:adapter --yes &&
          pnpm deploy:web --yes

  destroy:
    if: github.event.action == 'closed'
    name: Destroy PR preview
    runs-on: ubuntu-latest
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      ALCHEMY_ENV_FILE: /dev/null
    steps:
      # Shared setup (checkout, pnpm, store cache, frozen install).
      - uses: ./.github/actions/setup

      # Tears down web -> adapter -> api -> shared so no preview resources
      # linger after the PR is merged or closed.
      - name: Destroy preview stage
        run: >
          pnpm destroy:web --yes &&
          pnpm destroy:adapter --yes &&
          pnpm destroy:api --yes &&
          pnpm destroy:shared --yes
