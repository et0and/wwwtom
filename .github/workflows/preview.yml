name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    name: Deploy PR preview
    runs-on: ubuntu-latest
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      ALCHEMY_ENV_FILE: /dev/null
      # Alchemy's GitHub provider (preview-comment resource in the web stack)
      # needs a token to post/update the preview comment.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: ./.github/actions/setup

      # Deploys shared -> api -> adapter -> web. The web stack posts or
      # updates the preview comment via infra/utils/github/preview-comment.ts.
      - name: Deploy preview stage
        run: >
          pnpm deploy:shared --yes &&
          pnpm deploy:api --yes &&
          pnpm deploy:adapter --yes &&
          pnpm deploy:web --yes

  destroy:
    if: github.event.action == 'closed'
    name: Destroy PR preview
    runs-on: ubuntu-latest
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      ALCHEMY_ENV_FILE: /dev/null
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: ./.github/actions/setup

      # Tears down web -> adapter -> api -> shared so no preview resources
      # linger after the PR is merged or closed. Each step runs even when
      # the previous one fails: one stack (e.g. the queue delete racing a
      # still-bound worker) must never block the rest of the teardown.
      - name: Destroy web
        if: always()
        run: pnpm destroy:web --yes

      - name: Destroy adapter
        if: always()
        run: pnpm destroy:adapter --yes

      - name: Destroy api
        if: always()
        run: pnpm destroy:api --yes

      - name: Destroy shared
        if: always()
        run: pnpm destroy:shared --yes
