      - name: Deploy preview stage
        run: |-
          pnpm deploy:shared --yes &&
          pnpm deploy:api --yes &&
          pnpm deploy:adapter --yes &&
          pnpm deploy:web --yes &&
          pnpm deploy:sophie --yes &&
          pnpm deploy:preview --yes
  smoke:
    name: Smoke test the preview
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
