      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Deploy preview stage
        run: |-
          pnpm deploy:shared --yes &&
          pnpm deploy:api --yes &&
          pnpm deploy:adapter --yes &&
          pnpm deploy:web --yes &&
          pnpm deploy:sophie --yes
  perf:
    name: Measure PR perf
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event.action != 'closed'
    timeout-minutes: 20
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      ALCHEMY_ENV_FILE: /dev/null
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      AXIOM_QUERY_TOKEN: ${{ secrets.AXIOM_QUERY_TOKEN }}
      PERF_PROBE_TOKEN: ${{ secrets.PERF_PROBE_TOKEN }}
      PERF_REPORT_PATH: infra/perf-report.json
      PERF_MARKDOWN_PATH: infra/perf-report.md
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - name: Measure candidate vs staging
        run: pnpm --filter @tom/infra perf:pr
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: perf-report
          path: infra/perf-report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Comment perf report
        if: always()
        run: |-
          set -euo pipefail
          if [ ! -f infra/perf-report.md ]; then echo "No perf report to comment"; exit 0; fi
          marker="<!-- perf-report -->"
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" --paginate --jq '.[] | select((.body // "") | startswith("<!-- perf-report -->")) | .id' | head -n1)
          body=$(printf '%s\n\n%s' "$marker" "$(cat infra/perf-report.md)")
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" -f body="$body"
          fi
  destroy:
    name: Destroy PR preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      ALCHEMY_ENV_FILE: /dev/null
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
      - uses: ./.github/actions/setup
      - name: Destroy web preview stage
        run: pnpm destroy:web --yes
      - name: Destroy editor preview stage
