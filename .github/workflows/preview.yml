name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    name: Deploy PR preview
    runs-on: ubuntu-latest
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      ALCHEMY_ENV_FILE: /dev/null
    steps:
      - name: Check out repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deploys shared -> api -> adapter -> web. The web stack posts or
      # updates the preview comment via infra/utils/github/preview-comment.ts.
      - name: Deploy preview stage
        run: pnpm deploy --yes

  destroy:
    if: github.event.action == 'closed'
    name: Destroy PR preview
    runs-on: ubuntu-latest
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      ALCHEMY_ENV_FILE: /dev/null
    steps:
      - name: Check out repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tears down web -> adapter -> api -> shared so no preview resources
      # linger after the PR is merged or closed.
      - name: Destroy preview stage
        run: pnpm destroy --yes
