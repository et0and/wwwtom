name: Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      # Shared setup (checkout, pnpm, store cache, frozen install).
      # Release needs the full history and the embedded credentials.
      - uses: ./.github/actions/setup
        with:
          fetch-depth: 0

      - name: Fetch all tags and ensure branch is up to date
        run: |
          git fetch --tags
          git checkout dev
          git pull origin dev

      - name: Build
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run semantic-release
