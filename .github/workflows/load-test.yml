name: Load test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main
      - "*/*"

jobs:
  Load-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.7.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: npm run start &

      - name: Wait for server to be ready
        run: sleep 10

      - name: Run load test
        run: npx autocannon -d 30 -c 10000 http://localhost:3000
