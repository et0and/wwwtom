name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Alchemy stage to deploy
        required: true
        type: choice
        options:
          - production
          - staging
          - dev
  push:
    branches:
      - dev

# Pushes to dev deploy the STAGING stage (production is a manual
# workflow_dispatch with its own environment approval gates). The staging
# nightly e2e (e2e-staging.yml) then validates the freshly deployed stack.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'staging' || inputs.stage }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'staging' || inputs.stage }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.stage }}
    env:
      ALCHEMY_STAGE: ${{ github.event_name == 'push' && 'staging' || inputs.stage }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
      ALCHEMY_ENV_FILE: /dev/null

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Deploy infrastructure
        run: >
          pnpm deploy:shared --yes &&
          pnpm deploy:api --yes &&
          pnpm deploy:adapter --yes &&
          pnpm deploy:web --yes
