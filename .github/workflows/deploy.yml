name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Alchemy stage to deploy
        required: true
        type: choice
        options:
          - production
          - staging
          - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || inputs.stage }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'production' || inputs.stage }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || inputs.stage }}
    env:
      ALCHEMY_STAGE: ${{ github.event_name == 'push' && 'production' || inputs.stage }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOM_SECRETS: ${{ secrets.TOM_SECRETS }}
      ALCHEMY_ENV_FILE: /dev/null

    steps:
      - name: Check out repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Check pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy infrastructure
        run: >
          pnpm deploy:shared --yes &&
          pnpm deploy:api --yes &&
          pnpm deploy:adapter --yes &&
          pnpm deploy:web --yes
