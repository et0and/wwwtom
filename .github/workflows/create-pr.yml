name: Create PR from Prompt

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe what you want opencode to do"
        required: true
        type: string
      branch_name:
        description: "Branch name (optional)"
        required: false
        type: string
        default: ""
      model:
        description: "Model to use"
        required: false
        type: choice
        options:
          - opencode/kimi-k2.5-free
          - opencode/glm-4.7-free
          - opencode/minimax-m2.1-free
        default: "opencode/kimi-k2.5-free"

env:
  BRANCH_NAME: ${{ inputs.branch_name || format('opencode-pr-{0}', github.run_id) }}

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch
        run: |
          git checkout -b ${{ env.BRANCH_NAME }}

      - name: Run opencode with prompt
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ inputs.model }}
          prompt: ${{ inputs.prompt }}

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore: apply changes from opencode prompt

          Prompt: ${{ inputs.prompt }}"
          git push origin ${{ env.BRANCH_NAME }}

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "chore: changes from opencode - ${{ github.run_id }}" \
            --body "## 🤖 Automated Changes

          This PR was created by the \\"Create PR from Prompt\\" workflow.

          ### Original Prompt
          > ${{ inputs.prompt }}

          ### Model Used
          ${{ inputs.model }}

          ---
          Run ID: ${{ github.run_id }}" \
            --base ${{ github.ref_name }} \
            --head ${{ env.BRANCH_NAME }} \
            --label "opencode"

      - name: Comment if no changes
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          echo "No changes were made by opencode"
