name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: ./.github/actions/setup

      # Unit tests run in every workspace with a `test` script: @tom/web,
      # @tom/api, @tom/adapter, @tom/arena and @tom/utils. Turbo builds each
      # package's workspace dependencies first. Task artifacts are shared
      # through the KV-backed remote cache at turbo-cache.tom.so (TURBO_API
      # points Turbo at a custom server; TURBO_TEAM must be set or remote
      # caching stays disabled). Add the same value used as TURBO_CACHE_TOKEN
      # in the TOM_SECRETS bundle as a repository secret so CI runs can read
      # and write the cache.
      - name: Run unit tests
        env:
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
          TURBO_API: https://turbo-cache.tom.so
          TURBO_TOKEN: ${{ secrets.TURBO_CACHE_TOKEN }}
          TURBO_TEAM: wwwtom
        run: pnpm turbo run test
