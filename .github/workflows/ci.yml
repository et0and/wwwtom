name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - name: Check pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install

      # Unit tests run in every workspace with a `test` script: @tom/web,
      # @tom/api, @tom/adapter, @tom/arena and @tom/utils. @tom/margaret is
      # excluded because it has no test runner. Turbo builds each package's
      # workspace dependencies first.
      - name: Run unit tests
        env:
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
        run: pnpm turbo run test --filter=!@tom/margaret
