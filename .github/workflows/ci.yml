name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        env:
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
        run: pnpm turbo run test --filter=!@tom/margaret
