name: Validate PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-slim
    steps:
      - name: Validate PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const prTitle = context.payload.pull_request.title;
            
            // Conventional commit pattern: type(scope)!?: description
            // Types: feat, fix, chore, docs, refactor, test, ci, build, perf, style
            const validTypes = ['feat', 'fix', 'chore', 'docs', 'refactor', 'test', 'ci', 'build', 'perf', 'style'];
            const pattern = /^(feat|fix|chore|docs|refactor|test|ci|build|perf|style)(\([a-z-]+\))?!?:\s(.+)$/;
            
            if (!pattern.test(prTitle)) {
              const allowedTypes = validTypes.join(', ');
              core.setFailed(
                `Invalid PR title: "${prTitle}"\n\n` +
                `Title must follow conventional commit format: <type>[(optional-scope)]: <description>\n\n` +
                `Allowed types: ${allowedTypes}\n` +
                `Examples:\n` +
                `  feat: Add new feature\n` +
                `  fix: Correct bug in parser\n` +
                `  feat(auth): Add login functionality\n` +
                `  chore: Update dependencies`
              );
            } else {
              console.log(`PR title "${prTitle}" is valid.`);
            }
