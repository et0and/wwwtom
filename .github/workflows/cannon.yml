name: Autocannon performance stress test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main
      - "*/*"

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: latest

      - name: Check Bun version
        run: |
          echo "Bun version: $(bun -v)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start server
        run: bun run start &

      - name: Wait for server to be ready
        run: sleep 5

      - name: Run load test on home
        run: bunx autocannon -d 10 -c 10000 http://localhost:3000

      - name: Run load test on works directory
        run: bunx autocannon -d 10 -c 10000 http://localhost:3000/works

      - name: Run load test on blog posts
        run: bunx autocannon -d 10 -c 10000 http://localhost:3000/posts
