name: Setup repository
description: >-
  Pin pnpm, restore the pnpm store cache, and install dependencies with
  --frozen-lockfile. One definition for every workflow so the setup block
  never drifts. Call after an explicit `actions/checkout` (local composite
  actions require the workspace to exist first).
inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after setup.
    default: "true"
  install-playwright:
    description: >-
      Also cache (~/.cache/ms-playwright) and install the Playwright
      chromium browser (e2e-only workflows).
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

    # The pnpm store is content-addressed and shared across every job on
    # this runner type, so one warm store makes each parallel job's
    # `pnpm install` a near-instant restore — the "install once, reuse
    # everywhere" effect without actually shipping node_modules between
    # jobs.
    - name: Resolve the pnpm store path
      shell: bash
      run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

    - name: Restore the pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        # The lockfile is the single source of truth for the dependency
        # graph: any change invalidates the whole store cache.
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright browsers
      if: ${{ inputs.install-playwright == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/ms-playwright
        # The lockfile pins the playwright version, which pins the browser
        # revisions — any lockfile change just reinstalls.
        key: ${{ runner.os }}-ms-playwright-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright browsers
      if: ${{ inputs.install-playwright == 'true' }}
      shell: bash
      run: pnpm --filter @tom/e2e exec playwright install --with-deps chromium
