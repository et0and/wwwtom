; are.na frame — LilyGO/TENSTAR T-Display (ESP32-D0WD, 16MB flash, 1.14" ST7789).
; The display setup mirrors TFT_eSPI's Setup25_TTGO_T_Display, inlined so the
; library stays unpatched.
[env:tdisplay]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
; esp32dev defaults to a 4MB flash header, which makes the bootloader reject
; the 16MB partition table even on a 16MB chip. Override it here.
board_upload.flash_size = 16MB

build_flags =
  -DUSER_SETUP_LOADED=1
  -DUSER_SETUP_ID=25
  -DST7789_DRIVER=1
  -DTFT_SDA_READ=1
  -DTFT_WIDTH=135
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET=1
  -DTFT_MOSI=19
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=16
  -DTFT_RST=23
  -DTFT_BL=4
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=6000000

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.2.0

; Warnings and stack protection apply to this sketch's translation unit.
; Header warnings still surface (Arduino's own headers trip -Wconversion), but
; every diagnostic names its file, so warnings in src/main.cpp stand out.
build_src_flags =
  -Wall
  -Wextra
  -Wconversion
  -Wshadow
  -fstack-protector-strong
