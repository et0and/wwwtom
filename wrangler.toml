name = "wwwtom"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive binding
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "4721f0b0dc98471080accb2bf29f8edf"
      
# Main worker script
main = ".output/server/index.mjs"

# WASM bindings
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# Build configuration
[build]
command = "bun run build"

[observability.logs]
enabled = true

# Static assets configuration for Git LFS files
# This will serve your public/ directory files including those managed by Git LFS
[assets]
directory = ".output/public"

# Environment variables
[vars]
NODE_ENV = "production"
