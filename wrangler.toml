name = "wwwtom"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Main worker script
main = ".output/server/index.mjs"

# Build configuration
[build]
command = "bun run build"

[observability.logs]
enabled = true

# Static assets configuration for Git LFS files
# This will serve your public/ directory files including those managed by Git LFS
[assets]
directory = ".output/public"
binding = "ASSETS"

# Environment variables
[vars]
NODE_ENV = "production"


