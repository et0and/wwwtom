name = "wwwtom"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Main worker script
main = ".output/server/index.mjs"

# Build configuration
[build]
command = "bun run build"

# Static assets configuration for Git LFS files
# This will serve your public/ directory files including those managed by Git LFS
[assets]
directory = ".output/public"
binding = "ASSETS"

# Environment variables
[vars]
NODE_ENV = "production"

# Development configuration
[env.development]
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[env.development.vars]
NODE_ENV = "development"

# Preview environment
[env.preview]
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[env.preview.vars]
NODE_ENV = "preview"

# Production environment
[env.production]
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[env.production.vars]
NODE_ENV = "production"

# Wrangler dev server configuration
[dev]
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
port = 8788
